<style>
:root{color-scheme:light;--ink:#182230;--muted:#667085;--line:#e5e7eb;--bg:#f5f7fb;--card:#fff;--accent:#3157c8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:30px max(18px,calc((100% - 1200px)/2));background:#111827;color:white}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,34px)}header p{margin:0;color:#cbd5e1}.header-inner{max-width:1200px;margin:auto}.header-actions{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}.share-button{border:0;border-radius:8px;padding:10px 15px;background:#fff;color:#182230;font-weight:750;cursor:pointer}.share-button:hover{background:#e8edff}.share-status{font-size:13px;color:#cbd5e1}

.note{color:var(--muted);font-size:13px;margin:0 0 18px}
.slot{margin:0 0 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.slot-head{padding:10px 14px;background:#eef2ff;color:#243b82;font-weight:750;display:flex;justify-content:space-between;gap:12px}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.track{padding:14px;border-right:1px solid var(--line);min-width:0}.track:last-child{border:0}
.track-name{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--accent);margin-bottom:8px}
.event{padding:10px 0;border-top:1px solid var(--line)}.event:first-of-type{border-top:0}
.event h3{font-size:14px;line-height:1.45;margin:0 0 4px}.event.selectable{cursor:pointer;border:1px solid transparent;border-radius:9px;padding:11px;margin:4px 0;transition:background .15s,border-color .15s}.event.selectable:hover{background:#f5f7ff;border-color:#c7d2fe}.event.selectable:focus-visible{outline:3px solid #8095f5;outline-offset:2px}.event.selected{background:#fff1b8;border-color:#e6b422;box-shadow:inset 4px 0 #d69e00}.event.selected:hover{background:#ffedaa}.meta{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px;background:#eef2f7;color:#475467;margin:0 0 5px}
.empty{color:#98a2b3;font-size:13px;padding:10px 0}
.shared{padding:12px 14px;text-align:center;color:#475467;background:#fafafa;font-weight:650}
footer{max-width:1200px;margin:20px auto 40px;padding:0 16px;color:var(--muted);font-size:13px}
a{color:inherit}
@media(max-width:720px){main{margin:16px auto}.tracks{grid-template-columns:1fr}.track{border-right:0;border-bottom:1px solid var(--line);padding:12px 14px}.track:last-child{border-bottom:0}.track-name{margin-bottom:2px}.slot-head{font-size:14px}}

const names=["Track A","Track B","Track C"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const root=document.getElementById("schedule");
const selected=new Map();
function readSelection(){
 selected.clear();
 const params=new URLSearchParams(location.search);
 for(const value of params.getAll("s")){
  const match=value.match(/^(\\d+)-([0-2])$/);
  if(!match) continue;
  const slotIndex=Number(match[1]),trackIndex=Number(match[2]);
  if(slots[slotIndex]?.events?.[trackIndex]) selected.set(slotIndex,trackIndex);
 }
}
function writeSelection(){
 const url=new URL(location.href);
 url.searchParams.delete("s");
 for(const [slotIndex,trackIndex] of selected) url.searchParams.append("s",slotIndex+"-"+trackIndex);
 history.replaceState(null,"",url);
}
function render(){
 root.innerHTML=slots.map((slot,slotIndex)=>{
  const shared=slot.shared?'<div class="shared">'+esc(slot.shared)+'</div>':'';
  const tracks=slot.events?'<div class="tracks">'+slot.events.map((e,trackIndex)=>{
   const chosen=selected.get(slotIndex)===trackIndex;
   return '<section class="track"><div class="track-name">'+names[trackIndex]+'</div>'+(e?'<article class="event selectable'+(chosen?' selected':'')+'" role="button" tabindex="0" aria-pressed="'+chosen+'" data-slot="'+slotIndex+'" data-track="'+trackIndex+'"><span class="tag">'+esc(e[0])+'</span><h3>'+esc(e[1])+'</h3><div class="meta">'+esc(e[2])+(e[3]?' · '+esc(e[3]):'')+'</div></article>':'<div class="empty">—</div>')+'</section>';
  }).join('')+'</div>':'';
  return '<section class="slot"><div class="slot-head"><span>'+esc(slot.time)+'</span></div>'+shared+tracks+'</section>';
 }).join('');
}
function toggleSelection(slotIndex,trackIndex){
 if(selected.get(slotIndex)===trackIndex) selected.delete(slotIndex);
 else selected.set(slotIndex,trackIndex);
 writeSelection();
 render();
 updateStatus();
}
function updateStatus(){
 const count=selected.size;
 document.getElementById("shareStatus").textContent=count?count+"件のセッションを選択中":"セッションをクリックして選択（各時間帯1つまで）";
}
root.addEventListener("click",event=>{
 const card=event.target.closest(".event.selectable");
 if(card) toggleSelection(Number(card.dataset.slot),Number(card.dataset.track));
});
root.addEventListener("keydown",event=>{
 const card=event.target.closest(".event.selectable");
 if(card&&(event.key==="Enter"||event.key===" ")){event.preventDefault();toggleSelection(Number(card.dataset.slot),Number(card.dataset.track));}
});
document.getElementById("shareButton").addEventListener("click",async()=>{
 const url=location.href;
 const status=document.getElementById("shareStatus");
 try{
  await navigator.clipboard.writeText(url);
  status.textContent="共有URLをコピーしました！";
 }catch(error){
  status.textContent="URLをアドレスバーからコピーしてください";
  window.prompt("共有URL",url);
 }
});
readSelection();
render();
updateStatus();
</script>
